<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'" />
    <title>Switch Account</title>
    <style>
      @font-face {
        font-family: "Anthropic Sans";
        src: url("../about_window/assets/AnthropicSans-Roman-Variable-DDVos-BJ.woff2") format("woff2");
        font-weight: 300 800;
        font-style: normal;
      }
      @font-face {
        font-family: "Anthropic Serif";
        src: url("../about_window/assets/AnthropicSerif-Roman-Variable-2VcCjn5t.woff2") format("woff2");
        font-weight: 300 800;
        font-style: normal;
      }

      /* Same tokens as window-shared.css */
      :root {
        --brand-100: 15 54.2% 51.2%;
        --accent-100: 210 70.9% 51.6%;
        --bg-000: 0 0% 100%;
        --bg-100: 48 33.3% 97.1%;
        --bg-200: 53 28.6% 94.5%;
        --bg-300: 48 25% 92.2%;
        --border-300: 30 3.3% 11.8%;
        --danger-100: 0 56.2% 45.4%;
        --oncolor-100: 0 0% 100%;
        --text-100: 60 2.6% 7.6%;
        --text-300: 60 2.5% 23.3%;
        --text-500: 51 3.1% 43.7%;
        --page-bg: #fcfcfb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --brand-100: 15 63.1% 59.6%;
          --accent-100: 210 70.9% 51.6%;
          --bg-000: 60 2.1% 18.4%;
          --bg-100: 60 2.7% 14.5%;
          --bg-200: 30 3.3% 11.8%;
          --bg-300: 60 2.6% 7.6%;
          --border-300: 51 16.5% 84.5%;
          --danger-100: 0 67% 59.6%;
          --text-100: 48 33.3% 97.1%;
          --text-300: 50 9% 73.7%;
          --text-500: 48 4.8% 59.2%;
          --page-bg: #151515;
        }
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        font-family: "Anthropic Sans", ui-sans-serif, system-ui, sans-serif;
        font-size: 14px;
        color: hsl(var(--text-100));
        background: var(--page-bg);
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        user-select: none;
        display: flex;
        flex-direction: column;
      }
      button {
        font: inherit;
        cursor: pointer;
      }

      /* hiddenInset title bar: leave room for the traffic lights and make it draggable */
      .titlebar {
        height: 52px;
        flex-shrink: 0;
        -webkit-app-region: drag;
      }

      header {
        padding: 0 32px 20px;
      }
      h1 {
        font-family: "Anthropic Serif", ui-serif, Georgia, serif;
        font-size: 26px;
        font-weight: 400;
        letter-spacing: -0.01em;
      }
      header p {
        margin-top: 6px;
        color: hsl(var(--text-500));
      }

      main {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 0 32px 4px;
      }
      .list {
        list-style: none;
        padding: 0;
        background: hsl(var(--bg-000));
        border: 0.5px solid hsl(var(--border-300) / 0.15);
        border-radius: 12px;
        overflow: hidden;
      }
      .account {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 16px;
        cursor: pointer;
        transition: background-color 120ms;
      }
      .account + .account {
        border-top: 0.5px solid hsl(var(--border-300) / 0.15);
      }
      .account:hover {
        background: hsl(var(--bg-200));
      }
      .avatar {
        width: 36px;
        height: 36px;
        flex-shrink: 0;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-weight: 600;
        font-size: 14px;
        color: hsl(var(--oncolor-100));
        background: hsl(var(--brand-100));
      }
      .info {
        flex: 1;
        min-width: 0;
      }
      .name {
        font-weight: 500;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .email {
        margin-top: 2px;
        font-size: 13px;
        color: hsl(var(--text-500));
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .usage {
        display: grid;
        grid-template-columns: auto 64px 32px;
        align-items: center;
        column-gap: 6px;
        row-gap: 4px;
        flex-shrink: 0;
        font-size: 11px;
        font-variant-numeric: tabular-nums;
        color: hsl(var(--text-500));
      }
      .usage .pct {
        text-align: right;
        color: hsl(var(--text-300));
      }
      .usage-note {
        flex-shrink: 0;
        font-size: 11px;
        color: hsl(var(--text-500));
      }
      .bar {
        height: 4px;
        border-radius: 2px;
        background: hsl(var(--bg-300));
        overflow: hidden;
      }
      .bar > span {
        display: block;
        height: 100%;
        border-radius: 2px;
        background: hsl(var(--text-500));
      }
      .bar.warn > span {
        background: hsl(var(--brand-100));
      }
      .warn.pct {
        color: hsl(var(--brand-100));
      }
      .bar.crit > span {
        background: hsl(var(--danger-100));
      }
      .crit.pct {
        color: hsl(var(--danger-100));
      }
      .plan {
        min-width: 48px;
        text-align: center;
        font-size: 12px;
        padding: 2px 8px;
        border-radius: 6px;
        color: hsl(var(--text-300));
        background: hsl(var(--bg-300));
      }
      .check {
        width: 18px;
        height: 18px;
        flex-shrink: 0;
        color: hsl(var(--accent-100));
        visibility: hidden;
      }
      .account.active .check {
        visibility: visible;
      }
      .remove {
        border: none;
        background: none;
        padding: 4px;
        border-radius: 6px;
        color: hsl(var(--text-500));
        opacity: 0;
        transition: opacity 120ms;
      }
      .account:hover .remove {
        opacity: 1;
      }
      .remove:hover {
        color: hsl(var(--danger-100));
        background: hsl(var(--bg-300));
      }
      .empty {
        padding: 40px 16px;
        text-align: center;
        color: hsl(var(--text-500));
      }

      footer {
        flex-shrink: 0;
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        padding: 20px 32px 28px;
      }
      .btn {
        height: 36px;
        padding: 0 16px;
        border-radius: 8px;
        font-weight: 500;
        border: 0.5px solid hsl(var(--border-300) / 0.25);
        background: hsl(var(--bg-000));
        color: hsl(var(--text-100));
        transition: background-color 120ms;
      }
      .btn:hover {
        background: hsl(var(--bg-200));
      }
      .btn.primary {
        border-color: transparent;
        background: hsl(var(--text-100));
        color: var(--page-bg);
      }
      .btn.primary:hover {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div class="titlebar"></div>
    <header>
      <h1>Switch account</h1>
      <p>Choose the account you want to use in Claude</p>
    </header>
    <main>
      <ul class="list" id="list"></ul>
    </main>
    <footer>
      <button class="btn" id="close">Cancel</button>
      <button class="btn primary" id="add">Add account</button>
    </footer>

    <template id="row">
      <li class="account">
        <div class="avatar"></div>
        <div class="info">
          <div class="name"></div>
          <div class="email"></div>
        </div>
        <div class="usage">
          <span>5h</span>
          <div class="bar" data-window="5h"><span></span></div>
          <span class="pct" data-window="5h"></span>
          <span>7d</span>
          <div class="bar" data-window="7d"><span></span></div>
          <span class="pct" data-window="7d"></span>
        </div>
        <span class="plan"></span>
        <svg class="check" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 10.5l4 4 8-9" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <button class="remove" title="Remove account">
          <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
            <path d="M5 5l10 10M15 5L5 15" stroke-linecap="round" />
          </svg>
        </button>
      </li>
    </template>

    <script>
      let accounts = [];
      let currentUuid = "";

      const list = document.getElementById("list");
      const rowTemplate = document.getElementById("row");

      function toAccount(profile) {
        const isFree = profile.organization_plan === "claude_free";
        return {
          id: profile.uuid,
          name: profile.full_name || profile.email_address || "Unknown",
          email: profile.email_address || "",
          plan: profile.organization_plan,
          free: isFree,
          usage: { "5h": Math.round(profile["5h"] ?? 0), "7d": Math.round(profile["7d"] ?? 0) },
          active: profile.uuid === currentUuid,
        };
      }

      async function loadAccounts() {
        const { profile, profiles } = await window.getAllProfile();
        const all = { ...(profiles || {}) };
        if (profile && profile.uuid) {
          all[profile.uuid] = profile;
          currentUuid = profile.uuid;
        }
        accounts = Object.values(all).map(toAccount);
      }

      function usageLevel(pct) {
        if (pct >= 90) return "crit";
        if (pct >= 70) return "warn";
        return "";
      }

      function renderUsage(row, usage) {
        for (const window of ["5h", "7d"]) {
          const pct = usage[window];
          const level = usageLevel(pct);
          const bar = row.querySelector(`.bar[data-window="${window}"]`);
          const label = row.querySelector(`.pct[data-window="${window}"]`);
          bar.firstElementChild.style.width = `${pct}%`;
          if (level) {
            bar.classList.add(level);
            label.classList.add(level);
          }
          label.textContent = `${pct}%`;
        }
      }

      function render() {
        list.replaceChildren();
        if (accounts.length === 0) {
          const empty = document.createElement("li");
          empty.className = "empty";
          empty.textContent = "No accounts yet.";
          list.append(empty);
          return;
        }
        for (const account of accounts) {
          const row = rowTemplate.content.firstElementChild.cloneNode(true);
          row.classList.toggle("active", account.active);
          row.querySelector(".avatar").textContent = account.name.charAt(0).toUpperCase();
          row.querySelector(".name").textContent = account.name;
          row.querySelector(".email").textContent = account.email;
          row.querySelector(".plan").textContent = account.plan;
          if (account.free) {
            const usage = row.querySelector(".usage");
            const note = document.createElement("span");
            note.className = "usage-note";
            note.textContent = "Usage tracking not supported";
            usage.replaceWith(note);
          } else {
            renderUsage(row, account.usage);
          }
          row.addEventListener("click", async () => {
            if (account.id === currentUuid) {
              alert("当前已经是目标账号。");
              return;
            }
            if (!confirm("要切换账号吗？")) {
              return;
            }
            console.log("confirm switch account");
            try {
              await window.switchToAccount(account.id);
            } catch (err) {
              alert(`切换账号失败：${err.message}`);
            }
          });
          row.querySelector(".remove").addEventListener("click", (event) => {
            event.stopPropagation();
            accounts = accounts.filter((a) => a.id !== account.id);
            if (account.active && accounts.length > 0) {
              accounts[0].active = true;
            }
            render();
          });
          list.append(row);
        }
      }

      document.getElementById("close").addEventListener("click", () => window.close());
      document.getElementById("add").addEventListener("click", async () => {
        if (!confirm("确认添加新账号吗？")) {
          return;
        }
        try {
          await window.addAccount();
        } catch (err) {
          alert(`添加账号失败：${err.message}`);
        }
      });

      loadAccounts().then(render);
    </script>
  </body>
</html>
